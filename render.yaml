# Render Blueprint — declares the scheduled cron jobs that drive the
# Tuscany Storage backend. The web service (tuscany-storage) is provisioned
# OUTSIDE of this Blueprint (created manually earlier) so applying this
# blueprint does NOT spawn a duplicate Next.js service.
#
# Architecture: each cron job is its own Render cron service. They all POST
# to the existing web service's /api/cron endpoint with the shared
# CRON_SECRET, so the web service owns the DB connection logic, Mongoose
# models, and all the business code. The cron services are just timers +
# HTTP callers.
#
# Shared env group: APP_URL and CRON_SECRET are pasted ONCE into the
# `tuscany-cron-shared` env var group and inherited by every cron. CRON_SECRET
# must match the value set on the web service so it accepts the calls.
#
# autoDeploy is OFF for every cron: they are pure timers (HTTP callers) whose
# code almost never changes, and rebuilding all 11 on every push exhausted the
# workspace's build-pipeline minutes (builds then fail instantly with
# `pipeline_minutes_exhausted`). Deploy a cron manually when scripts/ change.

envVarGroups:
  - name: tuscany-cron-shared
    envVars:
      # Full https URL of the existing web service, e.g.
      # https://tuscany-storage.onrender.com
      - key: APP_URL
        sync: false
      # Shared secret — must equal the CRON_SECRET set on the web service.
      # Copy that value from the web service's Environment tab and paste here.
      - key: CRON_SECRET
        sync: false

services:
  # ── Legacy recurring-billing cron at 08:00 UTC (03:00 ET) ─────────────────
  # Uses its own endpoint (predates the /api/cron dispatcher).
  - type: cron
    name: tuscany-recurring-billing
    runtime: node
    region: ohio
    autoDeploy: false
    schedule: "0 8 * * *"
    buildCommand: npm install
    startCommand: node scripts/run-recurring-billing.js
    envVars:
      - fromGroup: tuscany-cron-shared

  # ── Invoice generation — daily 00:00 UTC ──────────────────────────────────
  - type: cron
    name: tuscany-generate-invoices
    runtime: node
    region: ohio
    autoDeploy: false
    schedule: "0 0 * * *"
    buildCommand: npm install
    startCommand: node scripts/run-cron-job.js generateInvoices
    envVars:
      - fromGroup: tuscany-cron-shared

  # ── Autopay charges — daily 02:00 UTC ─────────────────────────────────────
  - type: cron
    name: tuscany-autopay
    runtime: node
    region: ohio
    autoDeploy: false
    schedule: "0 2 * * *"
    buildCommand: npm install
    startCommand: node scripts/run-cron-job.js autopay
    envVars:
      - fromGroup: tuscany-cron-shared

  # ── PDK reconcile — daily 03:00 UTC (heals drift before delinquency runs) ─
  - type: cron
    name: tuscany-pdk-reconcile
    runtime: node
    region: ohio
    autoDeploy: false
    schedule: "0 3 * * *"
    buildCommand: npm install
    startCommand: node scripts/run-cron-job.js pdkReconcile
    envVars:
      - fromGroup: tuscany-cron-shared

  # ── Visitor access sweep — every 2 minutes ────────────────────────────────
  # Security-critical: PDK Holders have no native expiration field, so this
  # cron IS the enforcement layer for visitor PIN windows. The 2-minute
  # interval bounds the worst-case post-expiration access window for a
  # leaked PIN. DO NOT increase this interval without an explicit risk
  # acceptance.
  - type: cron
    name: tuscany-visitor-access
    runtime: node
    region: ohio
    autoDeploy: false
    schedule: "*/2 * * * *"
    buildCommand: npm install
    startCommand: node scripts/run-cron-job.js visitorAccessExpiration
    envVars:
      - fromGroup: tuscany-cron-shared

  # ── Delinquency escalation — daily 06:00 UTC ──────────────────────────────
  # Late fees, lockouts, lien/auction escalation. THE most important cron —
  # without this, non-paying tenants stay unbothered.
  - type: cron
    name: tuscany-delinquency
    runtime: node
    region: ohio
    autoDeploy: false
    schedule: "0 6 * * *"
    buildCommand: npm install
    startCommand: node scripts/run-cron-job.js delinquency
    envVars:
      - fromGroup: tuscany-cron-shared

  # ── Lockout report email — daily 07:00 UTC ────────────────────────────────
  - type: cron
    name: tuscany-lockout-report
    runtime: node
    region: ohio
    autoDeploy: false
    schedule: "0 7 * * *"
    buildCommand: npm install
    startCommand: node scripts/run-cron-job.js lockoutReportEmail
    envVars:
      - fromGroup: tuscany-cron-shared

  # ── Rate management reminder — daily 08:00 UTC (fires on configured day) ──
  - type: cron
    name: tuscany-rate-mgmt-reminder
    runtime: node
    region: ohio
    autoDeploy: false
    schedule: "0 8 * * *"
    buildCommand: npm install
    startCommand: node scripts/run-cron-job.js rateManagementReminder
    envVars:
      - fromGroup: tuscany-cron-shared

  # ── Payment reminders — daily 09:00 UTC ───────────────────────────────────
  - type: cron
    name: tuscany-reminders
    runtime: node
    region: ohio
    autoDeploy: false
    schedule: "0 9 * * *"
    buildCommand: npm install
    startCommand: node scripts/run-cron-job.js reminders
    envVars:
      - fromGroup: tuscany-cron-shared

  # ── Rate execution — daily 05:00 UTC ──────────────────────────────────────
  - type: cron
    name: tuscany-rate-execution
    runtime: node
    region: ohio
    autoDeploy: false
    schedule: "0 5 * * *"
    buildCommand: npm install
    startCommand: node scripts/run-cron-job.js rateExecution
    envVars:
      - fromGroup: tuscany-cron-shared

  # ── Rate management — monthly, 1st of month at 04:00 UTC ──────────────────
  - type: cron
    name: tuscany-rate-management
    runtime: node
    region: ohio
    autoDeploy: false
    schedule: "0 4 1 * *"
    buildCommand: npm install
    startCommand: node scripts/run-cron-job.js rateManagement
    envVars:
      - fromGroup: tuscany-cron-shared
